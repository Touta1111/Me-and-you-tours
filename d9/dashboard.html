<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D9 Business Dashboard</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1d26">
<link rel="icon" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/d9.css">
<style>
body{background:#f3efe7}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--night);color:#cfd8dc;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--serif);font-size:1.05rem;margin:0 6px 22px}
aside .brand img{width:32px;height:32px;border-radius:50%}
aside button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:inherit;font:500 .92rem var(--sans);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
aside button:hover{background:rgba(255,255,255,.06)}
aside button.on{background:var(--gold);color:#fff}
aside button b{width:22px;display:inline-grid;place-items:center;font-size:.8rem;opacity:.85}
aside .sep{height:1px;background:rgba(255,255,255,.1);margin:12px 6px}
main{padding:26px 28px 60px;max-width:1200px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:1.7rem;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi .v{font-size:1.6rem;font-weight:600;margin:4px 0}
.kpi .v.na{font-size:1rem;color:var(--muted);font-weight:500}
.src{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.15em .55em;border-radius:6px}
.src.real{background:#e2f2ea;color:var(--ok)}.src.imported{background:#e3eef8;color:#2a5f8f}.src.mixed{background:#efe7f8;color:#5e3d8f}.src.na{background:#eee;color:#777}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.panel h2{font-size:1.15rem;font-family:var(--sans);margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.wrap{white-space:normal;min-width:180px}
tr:hover td{background:#faf7f1}
.act{display:flex;gap:6px}
.act button:not(.btn){border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;font-size:.8rem}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ov{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .15s}
.ov:hover{border-color:var(--gold)}
.ov h3{font-family:var(--sans);font-size:1rem;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.ov ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.note{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5a1d;border-radius:12px;padding:10px 14px;font-size:.86rem;margin-bottom:16px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,29,38,.45)}
dialog form{padding:22px}
dialog h2{font-family:var(--sans);font-size:1.15rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:10px}
.badge{display:inline-block;padding:.12em .55em;border-radius:6px;font-size:.75rem;font-weight:600;background:var(--sand2)}
.b-open{background:#fdecd5;color:#8a5a12}.b-done{background:#e2f2ea;color:var(--ok)}.b-bad{background:#f8e1e1;color:var(--bad)}
.mobnav{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}aside{display:none}.mobnav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--night);position:sticky;top:0;z-index:5}.mobnav button{flex:0 0 auto;background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:999px;padding:.45em .9em;font:600 .8rem var(--sans)}.mobnav button.on{background:var(--gold)}main{padding:18px 14px 60px}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mobnav" id="mobnav"></div>
<div class="shell">
 <aside><div class="brand"><img src="img/icon-192.png" alt="">D9 Dashboard</div><div id="side"></div></aside>
 <main id="main"></main>
</div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" hidden>
<script src="assets/config.js"></script>
<script>
(function(){
var D=window.D9,$=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var KEY='d9_dash_v1';
var DEFAULT={bookings:[],requests:[],catalog:[
 {id:'c1',name:'Romantic Experience',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c2',name:'Birthday Experience',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c3',name:'VIP Arrival',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c4',name:'Breakfast in suite (per person)',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c5',name:'Late check-out',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c6',name:'Early check-in',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c7',name:'Extra cleaning',price:'',cost:'',commission:'',notes:'',src:'real'},
 {id:'c8',name:'Extra towels / amenities',price:'',cost:'',commission:'',notes:'',src:'real'}],
 orders:[],partners:[],referrals:[],leads:[],finance:[],marketing:[],settings:{currency:'EUR',units:10}};
var db=D.store.get(KEY,null)||JSON.parse(JSON.stringify(DEFAULT));
Object.keys(DEFAULT).forEach(function(k){if(db[k]===undefined)db[k]=JSON.parse(JSON.stringify(DEFAULT[k]));});

var S={
 bookings:{name:'reservation',f:[['guest','Guest name','text',1],['unit','Suite / unit','text'],['channel','Channel','select',['Direct','Airbnb','Booking.com','Expedia','Other']],['checkin','Check-in','date',1],['checkout','Check-out','date',1],['guests','Guests','number'],['amount','Total amount','number'],['paid','Payment','select',['Unpaid','Deposit','Paid']],['status','Status','select',['Confirmed','Cancelled']],['contact','Contact (phone/email)','text']],c:['guest','unit','channel','checkin','checkout','amount','paid','status']},
 requests:{name:'guest request',f:[['date','Date','date',1],['guest','Guest','text',1],['unit','Suite','text'],['type','Type','select',['Upgrade','Problem','Excursion interest','Booking request','Question','Complaint']],['detail','Details','textarea',1],['status','Status','select',['Open','In progress','Done']]],c:['date','guest','unit','type','detail','status']},
 catalog:{name:'upgrade',f:[['name','Upgrade','text',1],['price','Sales price','number'],['cost','Execution cost','number'],['commission','Commission to Hassan','number'],['notes','Notes / supplier','text']],c:['name','price','cost','commission','notes']},
 orders:{name:'upgrade sale',f:[['date','Date','date',1],['item','Upgrade','catalog',1],['guest','Guest','text'],['qty','Quantity','number'],['status','Status','select',['Requested','Confirmed','Done','Cancelled']],['paid','Paid','select',['No','Yes']]],c:['date','item','guest','qty','status','paid']},
 partners:{name:'excursion partner',f:[['name','Company','text',1],['license','Tourism licence no.','text'],['etaa','Checked in ETAA list','select',['No','Yes']],['insurance','Insurance proven','select',['No','Yes']],['service','Services','text'],['commission','Agreed commission','text'],['contract','Signed agreement','select',['No','Yes']],['contact','Contact','text']],c:['name','license','etaa','insurance','service','commission','contract']},
 referrals:{name:'referral',f:[['date','Date','date',1],['guest','Guest','text',1],['excursion','Excursion','text',1],['partner','Partner','partner'],['status','Status','select',['Interest','Booked','Done','Cancelled']],['commission','Commission amount','number'],['paidout','Commission received','select',['No','Yes']]],c:['date','guest','excursion','partner','status','commission','paidout']},
 leads:{name:'lead',f:[['business','Business','text',1],['contact','Contact','text'],['service','Service','select',['QR menu','Google Business Profile','Design','Travel guide','Website','Other']],['stage','Stage','select',['Lead','Quote sent','Client','In progress','Done','Lost']],['amount','Amount','number'],['paid','Paid','select',['No','Yes']],['date','Date','date'],['notes','Notes','textarea']],c:['business','service','stage','amount','paid','date']},
 finance:{name:'finance entry',f:[['date','Date','date',1],['kind','Type','select',['Income','Cost']],['category','Category','select',['Stays','Upgrades','Excursions','Local services','Software','Marketing','Supplies','Other']],['description','Description','text'],['amount','Amount','number',1]],c:['date','kind','category','description','amount']},
 marketing:{name:'marketing entry',f:[['month','Month','month',1],['visitors','Website visitors','number'],['campaign','Campaign / action','text'],['notes','Notes','textarea']],c:['month','visitors','campaign','notes']}
};
var PAGES=[['overview','◎','Overview'],['A','A','Reservations'],['B','B','Guest service'],['C','C','Excursions'],['D','D','Local services'],['E','E','Finance'],['F','F','Marketing'],['sep'],['upgrades','€','Upgrade prices'],['settings','⚙','Settings & backup']];
var page=(location.hash||'#overview').slice(1); if(!PAGES.some(function(p){return p[0]===page;})) page='overview';
var cur=function(){return db.settings.currency||'EUR';};
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function money(n){return cur()+' '+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){return new Date().toISOString().slice(0,10);}
function srcOf(list){if(!list.length)return 'na';var r=list.some(function(x){return x.src!=='imported';}),i=list.some(function(x){return x.src==='imported';});return r&&i?'mixed':(i?'imported':'real');}
function srcTag(s){return '<span class="src '+s+'">'+({real:'Real',imported:'Imported',mixed:'Real + imported',na:'Not available'})[s]+'</span>';}
function kpi(label,val,src,sub){return '<div class="kpi"><div class="l">'+label+'</div>'+(src==='na'?'<div class="v na">Not available yet</div>':'<div class="v">'+val+'</div>')+srcTag(src)+(sub?'<div class="small muted" style="margin-top:4px">'+sub+'</div>':'')+'</div>';}
function nav(){
 var h=PAGES.map(function(p){if(p[0]==='sep')return '<div class="sep"></div>';return '<button data-p="'+p[0]+'" class="'+(p[0]===page?'on':'')+'"><b>'+p[1]+'</b>'+p[2]+'</button>';}).join('');
 $('#side').innerHTML=h+'<div class="sep"></div><a href="index.html" style="color:#e9d3a8;font-size:.85rem;padding:0 12px">← Website</a>';
 $('#mobnav').innerHTML=PAGES.filter(function(p){return p[0]!=='sep';}).map(function(p){return '<button data-p="'+p[0]+'" class="'+(p[0]===page?'on':'')+'">'+p[2]+'</button>';}).join('');
 $$('[data-p]').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-p'));};});
}
function go(p){page=p;history.replaceState(null,'','#'+p);render();window.scrollTo(0,0);}
function cellVal(type,k,r){var v=r[k];
 if(k==='item'){var c=db.catalog.filter(function(x){return x.id===v;})[0];return esc(c?c.name:'—');}
 if(k==='partner'){var p=db.partners.filter(function(x){return x.id===v;})[0];return esc(p?p.name:'—');}
 if(['amount','price','cost','commission'].indexOf(k)!==-1&&v!==''&&v!=null&&!isNaN(parseFloat(v)))return money(num(v));
 if(k==='status'||k==='stage'||k==='paid'||k==='paidout'||k==='contract'||k==='etaa'||k==='insurance'){var good=['Done','Paid','Yes','Confirmed','Client'],bad=['Cancelled','Lost','No','Unpaid'];return '<span class="badge '+(good.indexOf(v)!==-1?'b-done':bad.indexOf(v)!==-1?'b-bad':'b-open')+'">'+esc(v||'—')+'</span>';}
 return esc(v===''||v==null?'—':v);}
function table(type,rows,extra){
 var s=S[type];
 if(!rows.length)return '<div class="empty">Nothing here yet. Add the first '+s.name+' with the button above'+(type==='bookings'?' or import a CSV export from your channel manager':'')+'.</div>';
 var heads=s.c.map(function(k){return '<th>'+s.f.filter(function(f){return f[0]===k;})[0][1]+'</th>';}).join('');
 var body=rows.map(function(r){return '<tr>'+s.c.map(function(k){return '<td class="'+(k==='detail'||k==='notes'?'wrap':'')+'">'+cellVal(type,k,r)+'</td>';}).join('')+'<td>'+srcTag(r.src==='imported'?'imported':'real')+'</td><td><div class="act">'+(extra?extra(r):'')+'<button data-ed="'+type+':'+r.id+'">Edit</button><button data-del="'+type+':'+r.id+'">Delete</button></div></td></tr>';}).join('');
 return '<div class="tw"><table><thead><tr>'+heads+'<th>Data</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function panel(title,type,rows,opts){opts=opts||{};return '<div class="panel"><div class="ph"><h2>'+title+'</h2><div class="act">'+(opts.btns||'')+(type?'<button class="btn btn-dark btn-sm" data-add="'+type+'">+ Add '+S[type].name+'</button>':'')+'</div></div>'+(opts.pre||'')+(type?table(type,rows,opts.extra):'')+'</div>';}
function sortDesc(a,k){return a.slice().sort(function(x,y){return String(y[k]||'').localeCompare(String(x[k]||''));});}
/* ---------- calculations ---------- */
function nightsIn(b,ys,ye){var s=Date.parse(b.checkin),e=Date.parse(b.checkout);if(isNaN(s)||isNaN(e))return 0;var a=Math.max(s,ys),z=Math.min(e,ye);return Math.max(0,Math.round((z-a)/864e5));}
function calcA(){var bs=db.bookings,act=bs.filter(function(b){return b.status!=='Cancelled';});var d=new Date(),ys=Date.UTC(d.getFullYear(),d.getMonth(),1),ye=Date.UTC(d.getFullYear(),d.getMonth()+1,1);var days=(ye-ys)/864e5;var booked=act.reduce(function(s,b){return s+nightsIn(b,ys,ye);},0);
 return {src:srcOf(bs),total:bs.length,upcoming:act.filter(function(b){return b.checkin>=today();}).length,occ:Math.round(booked/(num(db.settings.units)*days)*100),unpaid:act.filter(function(b){return b.paid!=='Paid';}).length,cancel:bs.filter(function(b){return b.status==='Cancelled';}).length,direct:act.filter(function(b){return b.channel==='Direct';}).length};}
function catOf(id){return db.catalog.filter(function(c){return c.id===id;})[0]||{};}
function serviceRows(){
 var rows=[];
 var stays=db.bookings.filter(function(b){return b.status!=='Cancelled';});
 rows.push({s:'Stays',rev:stays.reduce(function(a,b){return a+num(b.amount);},0),cost:0,open:stays.filter(function(b){return b.paid!=='Paid';}).reduce(function(a,b){return a+num(b.amount);},0),src:srcOf(db.bookings)});
 var ord=db.orders.filter(function(o){return o.status!=='Cancelled';});
 rows.push({s:'Upgrades',rev:ord.reduce(function(a,o){return a+num(catOf(o.item).price)*(num(o.qty)||1);},0),cost:ord.reduce(function(a,o){var c=catOf(o.item);return a+(num(c.cost)+num(c.commission))*(num(o.qty)||1);},0),open:ord.filter(function(o){return o.paid!=='Yes';}).reduce(function(a,o){return a+num(catOf(o.item).price)*(num(o.qty)||1);},0),src:srcOf(db.orders)});
 var ref=db.referrals.filter(function(r){return r.status==='Done'||r.status==='Booked';});
 rows.push({s:'Excursion commissions',rev:ref.reduce(function(a,r){return a+num(r.commission);},0),cost:0,open:ref.filter(function(r){return r.paidout!=='Yes';}).reduce(function(a,r){return a+num(r.commission);},0),src:srcOf(db.referrals)});
 var ld=db.leads.filter(function(l){return ['Client','In progress','Done'].indexOf(l.stage)!==-1;});
 rows.push({s:'Local services',rev:ld.reduce(function(a,l){return a+num(l.amount);},0),cost:0,open:ld.filter(function(l){return l.paid!=='Yes';}).reduce(function(a,l){return a+num(l.amount);},0),src:srcOf(db.leads)});
 var fi=db.finance.filter(function(f){return f.kind==='Income';}),fc=db.finance.filter(function(f){return f.kind==='Cost';});
 rows.push({s:'Other income / costs (ledger)',rev:fi.reduce(function(a,f){return a+num(f.amount);},0),cost:fc.reduce(function(a,f){return a+num(f.amount);},0),open:0,src:srcOf(db.finance)});
 return rows;
}
function monthResult(){var m=today().slice(0,7);var inc=0,cost=0,any=false;
 db.finance.forEach(function(f){if((f.date||'').slice(0,7)===m){any=true;if(f.kind==='Income')inc+=num(f.amount);else cost+=num(f.amount);}});
 db.orders.forEach(function(o){if((o.date||'').slice(0,7)===m&&o.status!=='Cancelled'){any=true;var c=catOf(o.item),q=num(o.qty)||1;inc+=num(c.price)*q;cost+=(num(c.cost)+num(c.commission))*q;}});

 db.leads.forEach(function(l){if((l.date||'').slice(0,7)===m&&['Client','In progress','Done'].indexOf(l.stage)!==-1){any=true;inc+=num(l.amount);}});
 db.bookings.forEach(function(b){if((b.checkin||'').slice(0,7)===m&&b.status!=='Cancelled'){any=true;inc+=num(b.amount);}});
 return {any:any,inc:inc,cost:cost};}

var R={};
R.overview=function(){var a=calcA(),openReq=db.requests.filter(function(r){return r.status!=='Done';}).length,inbox=D.store.get('d9_inbox',[]).length,sr=serviceRows(),rev=sr.reduce(function(s,r){return s+r.rev;},0),cost=sr.reduce(function(s,r){return s+r.cost;},0);

 return '<div class="top"><h1>D9 Business Dashboard</h1><span class="muted small">'+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span></div>'+

 '<div class="grid6">'+

 ov('B','B · Guest service',srcOf(db.requests.concat(db.orders)),[openReq+' open requests',db.orders.filter(function(o){return o.status==='Requested';}).length+' upgrade requests to confirm',db.requests.filter(function(r){return r.type==='Complaint'||r.type==='Problem';}).length+' problems / complaints'])+
 ov('C','C · Excursions',srcOf(db.partners.concat(db.referrals)),[db.partners.length+' partners ('+db.partners.filter(function(p){return p.contract==='Yes';}).length+' with signed agreement)',db.referrals.length+' referrals',db.referrals.filter(function(r){return r.status==='Done';}).length+' completed'])+
 ov('D','D · Local services',srcOf(db.leads),[db.leads.filter(function(l){return l.stage==='Lead';}).length+' leads',db.leads.filter(function(l){return l.stage==='Quote sent';}).length+' quotes sent',db.leads.filter(function(l){return l.stage==='In progress';}).length+' in progress',db.leads.filter(function(l){return l.stage==='Done';}).length+' completed'])+

 '</div>';};
R.A=function(){var a=calcA(),src=a.src;

function parseCSV(text){var rows=[],row=[],f='',q=false,i,c,sep=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
 for(i=0;i<text.length;i++){c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===sep){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
 if(f!==''||row.length){row.push(f);rows.push(row);}return rows.filter(function(r){return r.some(function(x){return x.trim()!=='';});});}
function pick(h,row,names){for(var i=0;i<h.length;i++){var k=h[i].toLowerCase().replace(/[^a-z]/g,'');if(names.indexOf(k)!==-1)return (row[i]||'').trim();}return '';}
function isoDate(s){if(!s)return '';var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);var d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10);}

 rows.slice(1).forEach(function(r){
  if(impType==='bookings'){var ci=isoDate(pick(h,r,['arrival','checkin','firstnight','arrivaldate','start'])),co=isoDate(pick(h,r,['departure','checkout','lastnight','departuredate','end']));if(!ci)return;

  if(impType==='finance'){var d=isoDate(pick(h,r,['date','createdat','created','transactiondate'])),a=pick(h,r,['amount','total','net','value']);if(!d||a==='')return;var ty=pick(h,r,['type','kind']).toLowerCase();var amt=num(a);

 });
 save();render();D.toast(n+' rows imported');}catch(e){D.toast('Import failed: '+e.message);}};rd.readAsText(file);});
