:root{--ocean:#102D40;--ocean2:#163d55;--turq:#18A8AD;--turqd:#0b6b70;--turqb:#0f7f84;--sand:#E9DDCB;--sand2:#f4ece0;--gold:#C9A978;--white:#FAFAF7;--ink:#20272B;--muted:#5b6468;--line:#e3dccf;--r:16px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}
#app{display:grid;min-height:100vh;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){#app{grid-template-columns:240px minmax(0,1fr)}}
.side{background:var(--ocean);color:#fff;padding:16px 12px;position:sticky;top:0;align-self:start;z-index:5}
@media(min-width:1000px){.side{min-height:100vh;max-height:100vh;overflow:auto}}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}.brand img{border-radius:50%}.brand b{font-family:Cormorant,serif;font-size:21px;letter-spacing:.06em;display:block;line-height:1.1}.brand small{color:var(--gold);letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.side nav a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;color:#d9e6ec;text-decoration:none;font-weight:600;font-size:15px;min-height:44px}
.side nav a[aria-current=page]{background:rgba(255,255,255,.13);color:#fff}.side nav a .n{margin-inline-start:auto;background:var(--gold);color:var(--ocean);border-radius:999px;padding:0 8px;font-size:12px;font-weight:800}
.who{font-size:13px;color:#b9cdd6;border-top:1px solid rgba(255,255,255,.15);margin-top:12px;padding-top:10px}.who b{color:#fff}
@media(max-width:999px){.side{position:static}.side nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}.side nav a{white-space:nowrap}.who{display:none}.brand{margin-bottom:8px}}
main{padding:22px 18px 60px;max-width:1200px;width:100%;outline:none;background:linear-gradient(180deg,#eef4f5 0,var(--white) 280px)}
@media(min-width:1000px){main{padding:30px 34px 80px}}
h1{font-family:Cormorant,serif;font-weight:600;font-size:clamp(30px,5vw,40px);margin:0;color:var(--ocean);line-height:1.1}
h2{font-family:Cormorant,serif;font-weight:600;font-size:26px;color:var(--ocean);margin:4px 0 10px;line-height:1.2}
h3{font-size:17px;margin:20px 0 10px;color:var(--ocean)}.panel h3{margin-top:0}h4{margin:14px 0 8px}
.k{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--turqd);margin:0 0 4px}
.small{font-size:14px}.muted{color:var(--muted)}.warn-t{color:#8a5a00}.ok-t{color:#0b6b48;font-weight:700}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.row.end{justify-content:flex-end}
.stack{display:grid;gap:12px}.stack.sm{gap:8px}
.cols{display:grid;gap:16px;margin-top:6px}@media(min-width:1100px){.cols{grid-template-columns:1.35fr 1fr}}.cols>*{min-width:0}
.two{display:grid;gap:10px}@media(min-width:620px){.two{grid-template-columns:1fr 1fr}}
.grid2{display:grid;gap:14px}@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:0;background:var(--turqb);color:#fff;font:700 15.5px Manrope,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px rgba(24,168,173,.22)}
.btn:hover{background:var(--turqd)}.btn.ghost{background:#fff;color:var(--ocean);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.gold{background:var(--gold);color:var(--ocean)}.btn.danger{background:#b3261e}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14.5px}.btn:disabled{opacity:.6;cursor:default}.btn.busy{cursor:progress;opacity:.7}
.link{background:none;border:0;color:var(--turqd);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 0;min-height:40px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
@media(max-width:560px){.acts .btn{flex:1 1 calc(50% - 8px)}}
.inp{display:block;width:100%;margin-top:6px;min-height:46px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:16px Manrope,sans-serif}
.inp:focus{outline:none;border-color:var(--turq);box-shadow:0 0 0 4px rgba(24,168,173,.15)}textarea.inp{resize:vertical}
.f{display:block;font-weight:700;font-size:14.5px;margin:10px 0}.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px}.check input{width:20px;height:20px;accent-color:var(--turq)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--ocean);font:600 14.5px Manrope,sans-serif;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ocean);color:#fff;border-color:var(--ocean)}.chip b{color:var(--turqd)}.chip.on b{color:var(--gold)}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}.kpi b{display:block;font-size:28px;color:var(--ocean);line-height:1.1}.kpi span{font-size:13.5px;color:var(--muted);font-weight:600}.kpi.alert{border-color:#e0a800;background:#fffaf0}
.hero{background:linear-gradient(135deg,var(--ocean),#1b5470);color:#fff;border-radius:20px;padding:22px;margin:12px 0}.hero h2{color:#fff}.hero ol{margin:0 0 14px;padding-inline-start:20px}.hero .btn{background:var(--gold);color:var(--ocean)}
.card.opp{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;text-align:start;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;font:inherit;color:inherit}
.card.opp:hover{border-color:var(--turq)}.dim{opacity:.6}
.ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--turq) calc(var(--p)*1%),#e7eef0 0);position:relative}.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}.ring b{position:relative;z-index:1;color:var(--ocean)}
.body{min-width:0}.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q{margin:6px 0 2px;font-weight:650;color:var(--ocean);overflow-wrap:anywhere}.reply{margin:8px 0 0;padding:8px 10px;background:var(--sand2);border-radius:10px;border-inline-start:3px solid var(--gold)}
.cat{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:800}.cat.hi{background:var(--ocean);color:#fff}.cat.md{background:var(--turq);color:#fff}.cat.lo{background:#dcecee;color:var(--turqd)}.cat.nr{background:#eee;color:#666}
.badge{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eef2f3;color:var(--ocean)}.badge.ok{background:#dff3ee;color:#0b6b48}.badge.warn{background:#fff3cd;color:#7a5b00}
.note{border-inline-start:4px solid var(--gold);background:#fff;padding:10px 14px;border-radius:10px;font-size:15px}
.tabs{display:flex;gap:6px;margin:10px 0}.tab{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:700 14.5px Manrope,sans-serif;color:var(--ocean);cursor:pointer}.tab.on{background:var(--ocean);color:#fff;border-color:var(--ocean)}
.drop{display:flex;align-items:center;gap:12px;border:2px dashed #b9d7d9;border-radius:16px;padding:18px;background:#f5fbfb;cursor:pointer}.drop input{width:1px;height:1px;opacity:0;position:absolute}
.pick{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px}.pick input{width:20px;height:20px;margin-top:2px;accent-color:var(--turq)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--sand2);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ocean)}.num{text-align:end}tr.click{cursor:pointer}tr.click:hover{background:#f6fafa}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;margin:7px 0}.bar i{display:block;height:13px;border-radius:7px;background:linear-gradient(90deg,var(--turq),var(--ocean));width:var(--w);min-width:3px}.bar b{text-align:end;color:var(--ocean)}
@media(max-width:520px){.bar{grid-template-columns:110px minmax(0,1fr) 32px}}
.code{display:block;padding:9px 11px;background:#f4f6f7;border-radius:10px;font-size:13px;overflow-wrap:anywhere;margin:6px 0 10px}
.hook{font-family:Cormorant,serif;font-size:21px;color:var(--ocean);margin:0 0 6px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.tl,.an{list-style:none;margin:0;padding:0;display:grid;gap:9px}.tl li{padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.yn{display:inline-block;min-width:66px;text-align:center;margin-inline-end:8px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800;text-transform:uppercase}.yn.yes{background:#dff3ee;color:#0b6b48}.yn.no{background:#f2f2f2;color:#666}.yn.unknown{background:#fff6e0;color:#7a5b00}
.termrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 0;font-size:14.5px}
.modal{position:fixed;inset:0;background:rgba(9,25,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:14px;z-index:50;overflow:auto}
.dlg{background:var(--white);border-radius:20px;padding:18px;width:100%;max-width:520px;outline:none;margin:auto 0}.dlg.wide{max-width:1100px}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:grid;gap:8px;z-index:80;width:min(92vw,460px)}.toast{background:var(--ocean);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2)}.toast.bad{background:#8c1d18}
.boot{display:grid;place-items:center;text-align:center;min-height:70vh;padding:30px;color:var(--ocean);grid-column:1/-1}.boot img{border-radius:50%}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,#eef2f3,#f7f9fa,#eef2f3);background-size:200% 100%;animation:sk 1.2s infinite;margin:12px 0}@keyframes sk{to{background-position:-200% 0}}
details summary{cursor:pointer;font-weight:700;color:var(--ocean)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
main,.stack>*,.panel,.two>*{min-width:0}td,th{overflow-wrap:anywhere}#app>*{min-width:0}
.bigreply{font-size:19px;line-height:1.5;padding:14px 16px;background:var(--sand2);border-radius:14px;border-inline-start:4px solid var(--gold);margin:12px 0;color:var(--ocean);font-weight:600;overflow-wrap:anywhere}
.steps{margin:6px 0;padding-inline-start:20px}.postcard .acts .btn{flex:1 1 200px;min-height:52px}
