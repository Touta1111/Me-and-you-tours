<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Me & You">
<meta name="theme-color" content="#062a33">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<title>Me & You Tours Egypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#062a33;--teal:#0d4f5c;--teal2:#14707f;--sea:#2aa3b3;--sand:#e9dcc3;--sand2:#f6f0e4;
  --gold:#c6a35c;--gold2:#e4cc94;--ink:#14262b;--muted:#5d7176;--line:#ece6da;--bg:#faf6ee;--card:#fff;
  --ok:#2e8b57;--warn:#c98a1b;--bad:#b84a3a;
  --r:22px;--sh:0 10px 30px rgba(60,45,20,.08);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,-apple-system,sans-serif;--ar:"Noto Naskh Arabic",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#062a33;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
button,.nav,.chip,.pill,figure,.dest,.mode,.stat{-webkit-user-select:none;user-select:none}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 30%,#14707f,#062a33 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s ease,visibility .5s}
#splash img{width:118px;height:118px;border-radius:50%;box-shadow:0 0 0 3px #c6a35c,0 20px 50px rgba(0,0,0,.35);animation:pop .8s ease}
#splash b{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:600;margin-top:22px}
#splash small{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#e4cc94;margin-top:6px}
#splash.out{opacity:0;visibility:hidden}
@keyframes pop{from{transform:scale(.7);opacity:0}}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom));box-shadow:0 0 50px rgba(0,0,0,.1);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal2)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px}
.kpi b,.stat b,.fx .big,.big,footer .mono{font-variant-numeric:lining-nums}
body *{font-variant-numeric:lining-nums}
h2{font-size:28px;line-height:1.1}
h3{font-size:21px;line-height:1.15}
.hidden{display:none!important}
.kick{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:4px 0 0}
.orn::before,.orn::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}

/* header */
.top{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top))!important;z-index:20;background:rgba(6,42,51,.95);backdrop-filter:blur(10px);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px}
.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.top .brand b{font-family:var(--serif);font-size:20px;font-weight:600;white-space:nowrap;display:block;line-height:1}
.top .brand small{display:block;font-size:9.5px;letter-spacing:1.2px;white-space:nowrap;text-transform:uppercase;opacity:.65;margin-top:3px}
.pill{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;gap:5px}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--deep)}
.pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.banner{background:#fff4dc;color:#7a5410;font-size:12.5px;padding:8px 16px;border-bottom:1px solid #f0dfb5}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:12px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.act{color:var(--teal)}
.nav button.center .bub{width:52px;height:52px;border-radius:18px;background:linear-gradient(150deg,var(--gold2),var(--gold));display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(198,163,92,.45);color:var(--deep)}
.nav button.center svg{stroke:var(--deep);width:24px;height:24px}
.nav button.center.act .bub{background:linear-gradient(150deg,var(--sea),var(--teal))}
.nav button.center.act svg{stroke:#fff}

/* layout */
.view{padding:18px 16px 24px}
.sec{margin-top:38px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;gap:10px}
.sec-h a,.link{font-size:13px;font-weight:600;color:var(--teal2);cursor:pointer;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:13px;font-weight:600;font-size:15px;background:var(--teal);color:#fff;width:100%;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(150deg,var(--gold2),var(--gold));color:var(--deep)}
.btn.ghost{background:transparent;border:1.5px solid var(--teal);color:var(--teal)}
.btn.wa{background:#1f9e57}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.5}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sand2);color:var(--teal)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* hero */
.hero{margin:-18px -16px 0;padding:150px 20px 70px;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;overflow:hidden;
  background:#062a33}
.hero .ph{position:absolute;inset:0;background-position:center 55%;background-size:cover;transform:scale(1.06);animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.16) translateY(-10px)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,42,51,.15) 0%,rgba(6,42,51,.25) 35%,rgba(6,42,51,.88) 75%,#062a33 100%)}
.hero>*:not(.ph):not(.shade):not(.waves){position:relative}
.hero .sun{position:absolute;right:-30px;top:30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(228,204,148,.55),rgba(228,204,148,0) 70%);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.8}}
.hero h1{font-size:42px;text-shadow:0 2px 20px rgba(0,0,0,.25);line-height:1.02;margin:12px 0 12px;position:relative}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{font-size:14.5px;opacity:.88;max-width:400px;position:relative}
.hero .ctas{display:flex;gap:10px;margin-top:22px;position:relative}
.trust{display:flex;gap:6px 14px;margin-top:18px;font-size:12px;opacity:.88;position:relative;flex-wrap:wrap}
.trust span::before{content:"✓ ";color:var(--gold2)}
.waves{position:absolute;left:0;bottom:-1px;width:200%;height:46px;display:flex}
.waves svg{width:50%;height:100%}
.w1{animation:drift 14s linear infinite;opacity:.35}
.w2{animation:drift 9s linear infinite reverse;opacity:1}
@keyframes drift{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-30px;position:relative;z-index:2}
.stat{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-family:var(--serif);font-size:22px;color:var(--teal);line-height:1.1}
.stat span{font-size:11px;color:var(--muted);font-weight:600}

/* modes / steps */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--sh)}
.mode .ic{width:42px;height:42px;border-radius:13px;background:var(--sand2);display:grid;place-items:center;margin:0 auto 8px;font-size:20px}
.mode b{display:block;font-size:13.5px}
.mode span{font-size:11.5px;color:var(--muted)}
.how{counter-reset:h}
.how div{position:relative;padding:0 0 16px 46px}
.how div::before{counter-increment:h;content:counter(h);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.how div::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.how div:last-child::after{display:none}
.how b{display:block}
.how span{font-size:13px;color:var(--muted)}

/* local card */
.local{background:linear-gradient(160deg,#fff,var(--sand2));border-radius:var(--r);padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.local .av{width:64px;height:64px;border-radius:20px;background:linear-gradient(150deg,var(--sea),var(--teal));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:28px;font-weight:700;flex:0 0 64px}
.local blockquote{font-family:var(--serif);font-size:19px;font-style:italic;line-height:1.3;margin:14px 0;color:var(--teal)}
.langs{display:flex;gap:6px;flex-wrap:wrap}

/* scroll rows */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px}
.hscroll::-webkit-scrollbar{display:none}
.act-card{flex:0 0 72%;scroll-snap-align:start;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.act-img{height:170px;display:grid;place-items:center;font-size:46px;position:relative}
.act-body{padding:12px 14px 14px}
.act-body b{display:block;font-size:15px}
.price{font-weight:700;color:var(--teal)}
.dest{flex:0 0 62%;scroll-snap-align:start;height:250px;border-radius:var(--r);position:relative;overflow:hidden;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--sh);cursor:pointer;text-align:left}
.dest .e{position:absolute;right:12px;top:10px;font-size:40px;opacity:.9}
.dest b{font-family:var(--serif);font-size:24px;line-height:1}
.dest span{font-size:12px;opacity:.9;margin-top:4px}

/* list items */
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:52px;height:52px;flex:0 0 52px;border-radius:15px;display:grid;place-items:center;font-size:22px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14.5px}
.li .t span{font-size:12.5px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* packages */
.pkg{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:2px solid transparent}
.pkg.feat{border-color:var(--gold)}
.pkg .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pkg h3{font-size:22px}
.pkg .pp{text-align:right;font-weight:700;color:var(--teal);font-size:17px;white-space:nowrap}
.pkg .pp small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pkg ul{list-style:none;margin:10px 0 12px}
.pkg li,.ticks li{font-size:13.5px;padding:3px 0 3px 22px;position:relative;list-style:none}
.pkg li::before,.ticks li::before{content:"";position:absolute;left:2px;top:9px;width:10px;height:6px;border-left:2px solid var(--sea);border-bottom:2px solid var(--sea);transform:rotate(-45deg)}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:14px;overflow:hidden}
table.cmp th,table.cmp td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.cmp th{font-size:11px;color:var(--muted);font-weight:700}
table.cmp td:first-child,table.cmp th:first-child{text-align:left;padding-left:12px}
.yes{color:var(--ok);font-weight:700}.no{color:#c3cccd}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px;outline:none}
.inp:focus{border-color:var(--sea)}
textarea.inp{min-height:80px;resize:vertical}
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
.checks button.on{border-color:var(--teal);background:#e7f3f4;color:var(--teal)}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--teal)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:600}
.stepper b{min-width:22px;text-align:center}
.search{position:relative}
.search .inp{padding-left:40px}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

/* dark cards */
.fx{background:linear-gradient(160deg,#0d4f5c,#062a33);color:#fff;border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.fx .big{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1}
.fx .inp{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.fx .inp::placeholder{color:rgba(255,255,255,.5)}
.fx label{color:rgba(255,255,255,.75)}
.tips li{font-size:13.5px;margin:7px 0 7px 18px}

/* price board */
.pb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pb:last-child{border-bottom:0}
.pb .t{flex:1;min-width:0}
.pb .t b{display:block;font-size:14.5px}
.pb .t span{font-size:12px;color:var(--muted)}
.pb .p{text-align:right;font-size:12.5px;white-space:nowrap}
.pb .p s{color:var(--bad);opacity:.8}
.pb .p b{display:block;color:var(--ok);font-size:15px}
.save{font-size:11px;font-weight:700;background:#dff2e6;color:#20723f;border-radius:999px;padding:2px 7px}

/* reviews */
.rv{flex:0 0 82%;scroll-snap-align:start;background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.rv p{font-family:var(--serif);font-size:18px;line-height:1.3;margin:8px 0 10px;font-style:italic}

/* faq */
details{background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:var(--sh)}
summary{list-style:none;padding:14px 44px 14px 16px;font-weight:600;font-size:14.5px;cursor:pointer;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:16px;top:10px;font-size:22px;color:var(--teal);font-weight:400;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details > div{padding:0 16px 14px;font-size:13.5px;color:var(--muted)}

/* phrases */
.ph-card{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ph-card:last-child{border-bottom:0}
.ph-card .t{flex:1}
.ph-card .t b{display:block;font-size:15px;color:var(--teal)}
.ph-card .t span{font-size:12.5px;color:var(--muted)}
.ph-card .ar{font-family:var(--ar);font-size:20px;direction:rtl;color:var(--ink)}

/* weather */
.wx{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:12px}
.wx>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.wx .bars{display:flex;gap:2px;align-items:flex-end;width:100%;height:100%}
.wx i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold2),var(--gold));display:block}
.wx i.sea{background:linear-gradient(180deg,#7fd0da,var(--sea))}
.wx small{font-size:9.5px;color:var(--muted);font-weight:600}
.wx b{font-size:10px;color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* trip */
.status{display:flex;gap:4px;margin:12px 0}
.status div{flex:1;text-align:center;font-size:10.5px;font-weight:600;color:var(--muted)}
.status div i{display:block;height:5px;border-radius:4px;background:var(--line);margin-bottom:5px}
.status div.on{color:var(--teal)}
.status div.on i{background:var(--teal)}
table.lines{width:100%;border-collapse:collapse;font-size:13.5px}
table.lines td{padding:8px 0;border-bottom:1px solid var(--line)}
table.lines td:last-child{text-align:right;font-weight:600;white-space:nowrap}
table.lines tr.tot td{border-bottom:0;font-weight:700;font-size:15px;color:var(--teal)}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ti{position:relative;padding:6px 0 10px}
.tl .ti::before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--sea);border:2px solid #fff}
.tl .ti b{font-size:14px}
.tl .ti span{display:block;font-size:12.5px;color:var(--muted)}
.pack{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.pack i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 22px;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.pack.on i{background:var(--ok);border-color:var(--ok)}
.pack.on span{text-decoration:line-through;color:var(--muted)}
.rate{display:flex;gap:6px;font-size:28px;color:#d3d9da}
.rate button.on{color:var(--gold)}

/* advisor */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--sh)}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--teal)}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-new{background:#fdecd2;color:#8a5a0c}.st-proposal{background:#e3effd;color:#1f5aa8}.st-booked{background:#dff2e6;color:#20723f}
.st-travelling{background:#e7f3f4;color:var(--teal)}.st-done{background:#eceeee;color:#5d7176}.st-cancelled{background:#f7e1dd;color:var(--bad)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(6,42,51,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.sheet .grab{position:relative;z-index:2;width:40px;height:5px;border-radius:5px;background:#cfd8d9;margin:2px auto 14px}
.dhero{margin:-10px -16px 16px;height:260px;display:flex;align-items:flex-end;padding:16px;color:#fff;position:relative;border-radius:24px 24px 0 0;overflow:hidden}
.dhero .e{position:absolute;right:16px;top:16px;font-size:56px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:var(--sh);max-width:90%;animation:fade .2s}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13.5px}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:28px 16px 8px}
footer .mono{font-family:var(--serif);font-size:30px;color:var(--teal);font-weight:700;line-height:1}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:1px;background:var(--sand2);padding:3px 8px;border-radius:8px;color:var(--teal)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal{grid-auto-flow:dense}
.gal figure{cursor:zoom-in;position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--sh);margin:0}
.gal figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.gal figure:hover img{transform:scale(1.05)}
.gal figure.tall{grid-row:span 2}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(6,42,51,.75))}
.split{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:#fff}
.split .pic{height:200px;background-size:cover;background-position:center}
.insta{background:linear-gradient(135deg,#0d4f5c,#14707f 50%,#c6a35c);color:#fff;border-radius:var(--r);padding:20px;text-align:center}
.insta h3{font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>

async function initData(){
  let db=null,user=null;
  try{db=await hostApi.use("db")}catch(e){}
  try{user=await hostApi.use("user")}catch(e){}
  if(user){try{S.isAdvisor=!!(await user.canEdit())}catch(e){}try{if((await user.can("data.write"))===false)S.canWrite=false}catch(e){}}
  if(!db){S.loaded=true;seedDemo();render();return}
  S.db=db;S.demo=false;
  const timer=setTimeout(()=>{if(!S.loaded)showBanner("Data can't be reached yet — showing what is available.")},10000);
  const total=Object.keys(COLS).length+1;let got=0;
  const done=()=>{if(++got>=total){S.loaded=true;clearTimeout(timer);hideBanner()}};
  const wrap=f=>{let d=false;return s=>{f(s);if(!d&&!s.metadata.fromCache){d=true;done()}render()}};
  const err=()=>{clearTimeout(timer);S.loaded=true;showBanner("Live data is unavailable right now.");render()};
  Object.keys(COLS).forEach(c=>db.collection(c).onSnapshot(wrap(s=>{S[c]=s.docs.map(d=>d.data())}),err));

function calcFx(){

let io=null;
function render(){
  renderNav();
  const h=S.mode==="client"?{home:vHome,explore:vExplore,plan:vPlan,money:vMoney,guide:vGuide,trip:vTrip}[S.tab]():{overview:vOverview,requests:vRequests,agenda:vAgenda,content:vContent,business:vBusiness}[S.advTab]();
  const a=document.activeElement;const keep=a&&a.id&&$("#view").contains(a)?{id:a.id,s:a.selectionStart}:null;
  const vals={};document.querySelectorAll("#view input[id],#view textarea[id]").forEach(el=>{if(el.type!=="checkbox"&&el.value&&!el.defaultValue)vals[el.id]=el.value;else if(el.value!==el.defaultValue)vals[el.id]=el.value});
  $("#view").innerHTML=`<div class="view">${h}</div>`;
  Object.entries(vals).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&!["codeIn"].includes(id))el.value=v});
  if(S.tab==="money"&&S.mode==="client"){calcFx();calcHaggle()}
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  if(S.openReq||S.openSup||S.openDest||S.zoom){const sc=$("#sheet .sheet");const top=sc?sc.scrollTop:0;const sv={};document.querySelectorAll("#sheet input[id],#sheet textarea[id],#sheet select[id]").forEach(el=>sv[el.id]=el.value);
    renderSheet();const n=$("#sheet .sheet");if(n){n.scrollTop=top;Object.entries(sv).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&v)el.value=v})}}
  if(io)io.disconnect();
  if("IntersectionObserver"in window){io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".reveal").forEach(el=>io.observe(el))}
  else document.querySelectorAll(".reveal").forEach(el=>el.classList.add("in"));
  setTimeout(()=>document.querySelectorAll(".reveal:not(.in)").forEach(el=>el.classList.add("in")),3500);
  setTimeout(()=>document.querySelectorAll(".reveal:not(.in)").forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight)el.classList.add("in")}),1200);
}

/* ================= EVENTS ================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a,[data-open],[data-sup],[data-pack],[data-copy],[data-zoom],.brand");if(!t)return;const d=t.dataset;
  if(d.nav)return go(d.nav);
  if(d.go){S.mode="client";if(d.go==="plan")S.form=S.form||newForm();closeSheet(true);return go(d.go)}
  if(t.id==="modeBtn"){S.mode=S.mode==="client"?"advisor":"client";closeSheet();window.scrollTo(0,0);return render()}
  if(t.id==="tripBtn")return go("trip");
  if(d.cat){S.cat=d.cat;return render()}
  if(d.guide){S.guide=d.guide;return render()}
  if(d.content){S.content=d.content;return render()}
  if(d.biz){S.biz=d.biz;return render()}
  if(d.dest){S.openDest=d.dest;return renderSheet()}
  if(d.zoom){S.zoom=d.zoom;return renderSheet()}
  if(d.zoomnav){const i=GAL.indexOf(S.zoom);S.zoom=GAL[(i+ +d.zoomnav+GAL.length)%GAL.length];return renderSheet()}
  if(d.plandest){S.form=S.form||newForm();S.form.destination=DEST_OPTS.find(o=>d.plandest.startsWith(o.split(" ")[0]))||"Other";closeSheet(true);return go("plan")}
  if(d.wish){S.wish.has(d.wish)?S.wish.delete(d.wish):S.wish.add(d.wish);if(S.form)S.form.activities=[...S.wish];saveLocal();return render()}
  if(d.pack!==undefined){const i=+d.pack;S.packed.has(i)?S.packed.delete(i):S.packed.add(i);saveLocal();return render()}
  if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast("Copied: "+d.copy)}catch(_){toast(d.copy)}return}
  if(d.rate){S.rating=+d.rate;document.querySelectorAll("[data-rate]").forEach(b=>b.classList.toggle("on",+b.dataset.rate<=S.rating));return}
  if(d.pkg){S.form=S.form||newForm();S.form.package=d.pkg;if(d.pkg==="companion"&&S.form.companion==="No")S.form.companion="Half days";S.step=0;return go("plan")}
  if(d.f){S.form[d.f]=d.f==="currencyHelp"?d.v==="Yes":d.v;return render()}
  if(d.cnt){const[k,v]=d.cnt.split(":");S.form[k]=Math.max(k==="adults"?1:0,Math.min(20,S.form[k]+ +v));return render()}
  if(d.tog){const a=S.form.activities;const i=a.indexOf(d.tog);i>=0?a.splice(i,1):a.push(d.tog);return render()}
  if(d.rf){S.reqFilter=d.rf;return render()}
  if(d.open)return(S.openReq=d.open,renderSheet());
  if(d.sup)return(S.openSup=d.sup,renderSheet());
  if(d.tg){t.classList.toggle("on");return}
  if(d.accept)return guarded(()=>DATA.update("requests",d.accept,{accepted:true,acceptedAt:Date.now()}),"Thank you! Your local will be in touch.");
  if(d.setst&&S.openReq)return guarded(()=>DATA.update("requests",S.openReq,{status:d.setst}),"Status: "+ST_LABEL[d.setst]);
  if(d.delitem!==undefined){const r=S.requests.find(x=>x.code===S.openReq);return guarded(()=>DATA.update("requests",r.code,{items:(r.items||[]).filter((_,i)=>i!=d.delitem)}))}
  if(d.delit!==undefined){const r=S.requests.find(x=>x.code===S.openReq);return guarded(()=>DATA.update("requests",r.code,{itinerary:(r.itinerary||[]).filter((_,i)=>i!=d.delit)}))}
  if(d.delprice)return guarded(()=>DATA.del("priceChecks",d.delprice),"Removed");
  if(d.delreview)return guarded(()=>DATA.del("reviews",d.delreview),"Removed");
  if(d.reject)return guarded(()=>DATA.del("reviewSubs",d.reject),"Rejected");
  if(d.approve){const r=S.reviewSubs.find(x=>x.id===d.approve);if(!r)return;const ok=await guarded(()=>DATA.set("reviews",{id:r.id,name:r.name,country:r.country,rating:r.rating,text:r.text,when:new Date(r.createdAt||Date.now()).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),createdAt:r.createdAt||Date.now()}));if(ok)await guarded(()=>DATA.del("reviewSubs",r.id),"Published");return}
  switch(d.act){
    case"nowa":return toast("The WhatsApp number will be added soon.");
    case"next":{const f=S.form;if(S.step===0&&!f.arrival)return toast("Please choose your arrival date.");if(f.departure&&f.arrival&&f.departure<f.arrival)return toast("Departure is before arrival.");S.step++;window.scrollTo(0,0);return render()}
    case"back":S.step=Math.max(0,S.step-1);return render();
    case"submit":{const f=S.form;if(!f.name.trim())return toast("Please add your name.");if(!f.whatsapp.trim()&&!f.email.trim())return toast("Add WhatsApp or e-mail so we can reach you.");
      const code="MY-"+Math.floor(1000+Math.random()*9000)+Math.random().toString(36).slice(2,4).toUpperCase();
      const req={code,name:f.name.trim(),email:f.email.trim(),whatsapp:f.whatsapp.trim(),lang:f.lang,destination:f.destination,arrival:f.arrival,departure:f.departure,hotel:f.hotel.trim(),adults:f.adults,kids:f.kids,budget:f.budget,activities:f.activities.slice(),companion:f.companion,currencyHelp:!!f.currencyHelp,package:f.package,occasion:f.occasion,notes:f.notes.trim(),status:"new",createdAt:Date.now(),items:[],itinerary:[]};
      t.disabled=true;
      try{await DATA.set("requests",req);S.myCode=code;S.form=null;S.step=0;S.wish.clear();saveLocal();S.tab="trip";render();toast("Request sent! Your code: "+code)}
      catch(err){t.disabled=false;toast(err&&err.code==="invalid_argument"?"You can't send requests from this view.":"Could not send. Please try again or WhatsApp us.")}return}
    case"findcode":{const v=($("#codeIn").value||"").trim().toUpperCase();if(!v)return;S.myCode=v;saveLocal();return render()}
    case"logout":S.myCode=null;saveLocal();return render();
    case"sendreview":{const r=S.requests.find(x=>x.code===S.myCode);const text=$("#rvText").value.trim();if(text.length<10)return toast("Write a few more words 🙂");if(!$("#rvOk").checked)return toast("Please tick the permission box.");
      const ok=await guarded(()=>DATA.set("reviewSubs",{id:"r"+uid(),code:r.code,name:$("#rvName").value.trim()||"Guest",country:$("#rvCountry").value.trim(),rating:S.rating,text,consent:true,createdAt:Date.now()}));if(ok){S.reviewSent=true;render()}return}
    case"saverates":{const eu=num($("#rEur").value),us=num($("#rUsd").value);if(!(eu>0))return toast("Enter the EUR rate.");return guarded(()=>DATA.settings({eurEgp:String(eu),usdEgp:us>0?String(us):"",ratesDate:today()}),"Rate published for travellers")}
    case"saveprofile":return guarded(()=>DATA.settings({advisorName:$("#pfName").value.trim(),base:$("#pfBase").value.trim(),bio:$("#pfBio").value.trim(),languages:$("#pfLang").value.trim(),whatsapp:$("#pfWa").value.trim()}),"Profile saved");
    case"addprice":{const item=$("#pcItem").value.trim(),tp=num($("#pcT").value),lp=num($("#pcL").value);if(!item||!(tp>0)||!(lp>0))return toast("Item and both prices are needed.");if(!$("#pcProof").value.trim())return toast("Add the proof (receipt, photo, menu).");
      return guarded(()=>DATA.set("priceChecks",{id:"p"+uid(),item,place:$("#pcPlace").value.trim(),tourist:tp,local:lp,date:$("#pcDate").value||today(),proof:$("#pcProof").value.trim()}),"Price check published")}
    case"addreview":{const text=$("#mrText").value.trim();if(!text||!$("#mrName").value.trim())return toast("Text and name are needed.");if(!$("#mrOk").checked)return toast("Only with the guest's permission.");
      return guarded(()=>DATA.set("reviews",{id:"r"+uid(),name:$("#mrName").value.trim(),country:$("#mrCountry").value.trim(),rating:+$("#mrStars").value,text,when:new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"}),createdAt:Date.now()}),"Review published")}
    case"close":return closeSheet();
    case"additem":{const r=S.requests.find(x=>x.code===S.openReq);const label=$("#itLabel").value.trim(),price=num($("#itPrice").value);if(!label||!(price>=0))return toast("Add a line and a price.");
      const ok=await guarded(()=>DATA.update("requests",r.code,{items:(r.items||[]).concat([{label,type:$("#itType").value,price,commission:num($("#itCom").value)||0}])}));if(ok){["itLabel","itPrice"].forEach(id=>{const el=document.getElementById(id);if(el)el.value=""})}return}
    case"addday":{const r=S.requests.find(x=>x.code===S.openReq);const title=$("#dpTitle").value.trim();if(!title||!$("#dpDate").value)return toast("Add a date and what happens.");
      const ok=await guarded(()=>DATA.update("requests",r.code,{itinerary:(r.itinerary||[]).concat([{date:$("#dpDate").value,time:$("#dpTime").value,title,note:$("#dpNote").value.trim()}])}));if(ok){["dpTitle","dpNote","dpTime"].forEach(id=>{const el=document.getElementById(id);if(el)el.value=""})}return}
    case"delreq":{if(t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Tap again to delete";return}const c=S.openReq;closeSheet();return guarded(()=>DATA.del("requests",c),"Request deleted")}
    case"addsup":S.openSup="new";return renderSheet();
    case"savesup":{const s=S._sup;const o={id:s.id,name:$("#sName").value.trim(),category:$("#sCat").value,commission:$("#sCom").value.trim(),phone:$("#sPhone").value.trim(),licence:$("#sLic").value.trim(),priceNote:$("#sPrice").value.trim(),licensed:$("#sLicB").classList.contains("on"),insured:$("#sInsB").classList.contains("on"),notes:$("#sNotes").value.trim()};
      if(!o.name)return toast("Add a name.");closeSheet();return guarded(()=>DATA.set("suppliers",o),"Supplier saved")}
    case"delsup":{if(t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Tap again";return}const id=S._sup.id;closeSheet();return guarded(()=>DATA.del("suppliers",id),"Supplier deleted")}
  }
  if(t.classList.contains("brand")){S.mode="client";return go("home")}
});
document.addEventListener("input",e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(k&&S.form){S.form[k]=e.target.value;return}
  if(["fxEur","fxOff","fxFee"].includes(e.target.id))calcFx();
  if(e.target.id==="hgIn")calcHaggle();
  if(e.target.id==="q"){S.q=e.target.value;render()}
});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&S.form){S.form[k]=e.target.value;if(k==="package")render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});


window.addEventListener("hashchange",applyRoute);window.addEventListener("popstate",applyRoute);
{const _r=render;render=function(){_r();syncHash()};const _rs=renderSheet;renderSheet=function(){_rs();syncHash()}}
applyRoute();initData();
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
setTimeout(()=>{const sp=document.getElementById("splash");if(sp){sp.classList.add("out");setTimeout(()=>sp.remove(),600)}},1300);
</script>
</body>
</html>
